spring.application.name=backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#SCHEMA
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# API Prix des carburants (CarburantApiClient)
# URL de l'endpoint "records" ; peut être remplacée par la variable d'environnement CARBURANT_API_URL (voir INSTALL.md)
smartcarbure.api-carburants.url=${CARBURANT_API_URL:https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records}
smartcarbure.api-carburants.delai-connexion=3s
smartcarbure.api-carburants.delai-lecture=5s
# Nombre maximal de stations renvoyées par une recherche (pages de 100 : 500 = 5 appels au plus)
smartcarbure.api-carburants.max-resultats=500

# Service d'itinéraire OpenRouteService (ItineraireClient)
# La clé est personnelle : elle vient de la variable d'environnement ITINERAIRE_API_KEY (fichier .env), jamais de GitHub
smartcarbure.itineraire.url=${ITINERAIRE_API_URL:https://api.openrouteservice.org}
smartcarbure.itineraire.cle=${ITINERAIRE_API_KEY:}
smartcarbure.itineraire.delai-connexion=3s
smartcarbure.itineraire.delai-lecture=10s